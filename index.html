<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>My Game</title>
  <style>
    body {
      margin: 0;
      background: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    canvas {
      border: 2px solid #555;
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <canvas id="game" width="800" height="500"></canvas>
  <!-- Load game.js fresh each time so edits show up without a hard-refresh
       (GitHub Pages caches files for ~10 min otherwise). -->
  <script>
    const s = document.createElement("script");
    s.src = "game.js?v=" + Date.now();
    document.body.appendChild(s);
  </script>
</body>
</html>
